name: CD

# App version for humans/GitHub == explicit git tag (e.g. v1.0.0).
# Does not auto-bump CFBundleShortVersionString or ship TestFlight.
on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare iOS simulators
        run: |
          xcrun simctl list >/dev/null || true
          if ! xcrun simctl list devices available | grep -q 'iPhone'; then
            xcodebuild -downloadPlatform iOS
            xcrun simctl list >/dev/null || true
          fi

      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(
            xcrun simctl list devices available \
              | sed -n 's/.*iPhone[^(]*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p' \
              | head -n 1
          )
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Verify unit tests
        run: |
          xcodebuild test \
            -project NewsPortfolio.xcodeproj \
            -scheme NewsPortfolio \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:NewsPortfolioTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
